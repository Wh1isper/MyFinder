75" font-size="14" font-weight="400" text-anchor="start">Same time and value axes.</text><text x="1290" y="553" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Others still collect.</text><text x="1290" y="671" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">No misleading total</text><text x="1290" y="703" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Do not add busy %.</text><text x="1290" y="726" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Do not merge overlapping</text><text x="1290" y="749" fill="#606975" font-size="14" font-weight="400" text-anchor="start">device / volume scopes.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">ADOPTED DESIGN · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Defaults and scope: spec/08-design-baseline.md</text></g></svg>