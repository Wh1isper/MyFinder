<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>The panel should earn its desktop space</title><desc>MyFinder adopted design baseline 13. All readings are illustrative sample data, not live measurements.</desc><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#263D37" flood-opacity="0.10"/></filter></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F3F6" stroke="none"/><text x="64" y="52" fill="#2167B5" font-size="15" font-weight="700" text-anchor="start">MYFINDER  /  DESIGN STUDIES</text><text x="1536" y="52" fill="#606975" font-size="17" font-weight="600" text-anchor="end">13</text><text x="64" y="112" fill="#20242B" font-size="42" font-weight="600" text-anchor="start">The panel should earn its desktop space</text><text x="64" y="151" fill="#606975" font-size="19" font-weight="400" text-anchor="start">A scale-labeled footprint study. The adopted base sizes still require native DPI and accessibility validation.</text><text x="64" y="211" fill="#20242B" font-size="20" font-weight="600" text-anchor="start">1920 × 1080 desktop illustration at 0.5×</text><rect x="64" y="235" width="960" height="540" rx="8" fill="#DDE5F0" stroke="none"/><rect x="64" y="755" width="960" height="20" rx="0" fill="#EEF1F6" stroke="none"/><rect x="160" y="349" width="556" height="344" rx="8" fill="#F6F8FB" stroke="none"/><text x="184" y="383" fill="#606975" font-size="19" font-weight="400" text-anchor="start">Your work remains the main surface</text><line x1="184" y1="408" x2="686" y2="408" stroke="#DDE1E7" stroke-width="1" /><g transform="translate(328,247) scale(0.5)"><rect x="0" y="0" width="432" height="32" rx="8" fill="#FFFFFF" stroke="#DDE1E7"/><text x="8" y="21" fill="#606975" font-size="16" font-weight="400" text-anchor="start">⋮</text><text x="22" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">CPU</text><text x="51" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">32%</text><text x="124" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">RAM</text><text x="157" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">15.4 GiB</text><text x="226" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">ETH RX</text><text x="271" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">2.4 MB/s</text><text x="328" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">C: used</text><text x="371" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">621 GB</text></g><text x="64" y="825" fill="#20242B" font-size="19" font-weight="600" text-anchor="start">1:1 study / Minimal 432 × 32 logical pixels at 100% scale</text><g transform="translate(64,851) scale(1)"><rect x="0" y="0" width="432" height="32" rx="8" fill="#FFFFFF" stroke="#DDE1E7"/><text x="8" y="21" fill="#606975" font-size="16" font-weight="400" text-anchor="start">⋮</text><text x="22" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">CPU</text><text x="51" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">32%</text><text x="124" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">RAM</text><text x="157" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">15.4 GiB</text><text x="226" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">ETH RX</text><text x="271" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">2.4 MB/s</text><text x="328" y="20" fill="#606975" font-size="11" font-weight="600" text-anchor="start">C: used</text><text x="371" y="20" fill="#20242B" font-size="12" font-weight="600" text-anchor="start">621 GB</text></g><text x="1070" y="263" fill="#20242B" font-size="23" font-weight="600" text-anchor="start">Footprint before decoration</text><text x="1070" y="302" fill="#606975" font-size="18" font-weight="400" text-anchor="start">432 × 32 occupies ~0.67%</text><text x="1070" y="331" fill="#606975" font-size="18" font-weight="400" text-anchor="start">of a 1920 × 1080 area at 100%.</text><text x="1070" y="360" fill="#606975" font-size="18" font-weight="400" text-anchor="start">Placement still matters more</text><text x="1070" y="389" fill="#606975" font-size="18" font-weight="400" text-anchor="start">than the percentage alone.</text><text x="1070" y="474" fill="#20242B" font-size="22" font-weight="600" text-anchor="start">At the usable minimum</text><text x="1070" y="513" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Keep values, units and identity.</text><text x="1070" y="542" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Remove optional mini trends.</text><text x="1070" y="571" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Do not scale every glyph down.</text><text x="1070" y="600" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Text scaling may need more room.</text><text x="1070" y="687" fill="#20242B" font-size="22" font-weight="600" text-anchor="start">Details grow independently</text><text x="1070" y="726" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Adding monitored drives does not</text><text x="1070" y="755" fill="#606975" font-size="17" font-weight="400" text-anchor="start">widen the panel. Open details</text><text x="1070" y="784" fill="#606975" font-size="17" font-weight="400" text-anchor="start">for resource navigation and facts.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">ADOPTED DESIGN · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Defaults and scope: spec/08-design-baseline.md</text></g></svg>