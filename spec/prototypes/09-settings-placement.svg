<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Appearance settings / explicit, small and predictable</title><desc>MyFinder high-level design illustration 09. All readings are illustrative sample data, not live measurements.</desc><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#263D37" flood-opacity="0.10"/></filter></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F3F6" stroke="none"/><text x="64" y="52" fill="#2167B5" font-size="15" font-weight="700" text-anchor="start">MYFINDER  /  DESIGN STUDIES</text><text x="1536" y="52" fill="#606975" font-size="17" font-weight="600" text-anchor="end">09</text><text x="64" y="112" fill="#20242B" font-size="42" font-weight="600" text-anchor="start">Appearance settings / explicit, small and predictable</text><text x="64" y="151" fill="#606975" font-size="19" font-weight="400" text-anchor="start">Illustrative controls and values, not a parameter contract or implemented settings screen.</text><rect x="64" y="205" width="1192" height="700" rx="14" fill="#FFFFFF" stroke="#DDE1E7"/><text x="90" y="249" fill="#20242B" font-size="25" font-weight="600" text-anchor="start">MyFinder / Appearance</text><text x="90" y="301" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Orientation</text><rect x="525" y="277" width="700" height="39" rx="7" fill="#F4F5F7" stroke="none"/><text x="545" y="303" fill="#20242B" font-size="16" font-weight="400" text-anchor="start">Horizontal / Vertical</text><text x="90" y="331" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Does not change the selected resources.</text><line x1="90" y1="349" x2="1225" y2="349" stroke="#DDE1E7" stroke-width="1" /><text x="90" y="387" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Style</text><rect x="525" y="363" width="700" height="39" rx="7" fill="#F4F5F7" stroke="none"/><text x="545" y="389" fill="#20242B" font-size="16" font-weight="400" text-anchor="start">Balanced / Minimal / Capsules</text><text x="90" y="417" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Same styles in either orientation.</text><line x1="90" y1="435" x2="1225" y2="435" stroke="#DDE1E7" stroke-width="1" /><text x="90" y="473" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Panel size</text><rect x="525" y="449" width="700" height="39" rx="7" fill="#F4F5F7" stroke="none"/><text x="545" y="475" fill="#20242B" font-size="16" font-weight="400" text-anchor="start">100%–200% · 10% steps · default 100%</text><text x="90" y="503" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Text scale can increase the minimum.</text><line x1="90" y1="521" x2="1225" y2="521" stroke="#DDE1E7" stroke-width="1" /><text x="90" y="559" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Theme</text><rect x="525" y="535" width="700" height="39" rx="7" fill="#F4F5F7" stroke="none"/><text x="545" y="561" fill="#20242B" font-size="16" font-weight="400" text-anchor="start">Follow system / Light / Dark</text><text x="90" y="589" fill="#606975" font-size="14" font-weight="400" text-anchor="start">One preference for panel, details and settings.</text><line x1="90" y1="607" x2="1225" y2="607" stroke="#DDE1E7" stroke-width="1" /><text x="90" y="645" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Background opacity</text><rect x="525" y="621" width="700" height="39" rx="7" fill="#F4F5F7" stroke="none"/><text x="545" y="647" fill="#20242B" font-size="16" font-weight="400" text-anchor="start">80%–100% · 5% steps · default 100%</text><text x="90" y="675" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Foreground stays opaque; solid fallback available.</text><line x1="90" y1="693" x2="1225" y2="693" stroke="#DDE1E7" stroke-width="1" /><text x="90" y="731" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Placement</text><rect x="525" y="707" width="700" height="39" rx="7" fill="#F4F5F7" stroke="none"/><text x="545" y="733" fill="#20242B" font-size="16" font-weight="400" text-anchor="start">Primary display · top-center · unlocked</text><text x="90" y="761" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Edge alignment does not enable auto-hide.</text><line x1="90" y1="779" x2="1225" y2="779" stroke="#DDE1E7" stroke-width="1" /><text x="90" y="866" fill="#2167B5" font-size="16" font-weight="600" text-anchor="start">Applies directly · collection and history do not restart for appearance changes.</text><text x="1290" y="279" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">Independent choices</text><text x="1290" y="311" fill="#606975" font-size="14" font-weight="400" text-anchor="start">No six-mode system.</text><text x="1290" y="334" fill="#606975" font-size="14" font-weight="400" text-anchor="start">No one-tile-per-disk rule.</text><text x="1290" y="357" fill="#606975" font-size="14" font-weight="400" text-anchor="start">No auto-hide timer.</text><text x="1290" y="475" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">Windows target</text><text x="1290" y="507" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Windows 10 and newer.</text><text x="1290" y="530" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Compatibility needs tests.</text><text x="1290" y="553" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Current build: Windows 11.</text><text x="1290" y="671" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">Plain alpha only</text><text x="1290" y="703" fill="#606975" font-size="14" font-weight="400" text-anchor="start">No blur or click-through.</text><text x="1290" y="726" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Foreground stays opaque.</text><text x="1290" y="749" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Solid fallback is required.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">DESIGN CONCEPT · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Concepts and boundaries: spec/08-design-baseline.md</text></g></svg>