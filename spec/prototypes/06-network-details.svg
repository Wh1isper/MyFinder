xt><text x="300" y="738" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Connection / type</text><text x="729" y="738" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">Connected / Ethernet</text><text x="300" y="764" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Reported link capacity</text><text x="729" y="764" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">1 Gb/s</text><text x="300" y="790" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Wi-Fi</text><text x="729" y="790" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">Disconnected</text><text x="300" y="816" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Addresses</text><text x="729" y="816" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">Hidden · Reveal</text><text x="767" y="710" fill="#83BAFF" font-size="12" font-weight="700" text-anchor="start">COUNTING INTERVAL</text><text x="767" y="738" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Session start / sent</text><text x="1230" y="738" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">14:00 / 94 MB</text><text x="767" y="764" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Coverage</text><text x="1230" y="764" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">Partial · interruption shown</text><text x="767" y="790" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Last observation</text><text x="1230" y="790" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">14:30:00</text><text x="767" y="816" fill="#B4BDC9" font-size="13" font-weight="400" text-anchor="start">Scope</text><text x="1230" y="816" fill="#F3F5F8" font-size="13" font-weight="600" text-anchor="end">Ethernet only; no adapter sum</text><text x="300" y="866" fill="#B4BDC9" font-size="12" font-weight="400" text-anchor="start">Missing intervals are not zero traffic. Session totals include observed counter intervals only.</text><text x="1290" y="279" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">Dark system theme</text><text x="1290" y="311" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Panel, details and settings</text><text x="1290" y="334" fill="#606975" font-size="14" font-weight="400" text-anchor="start">follow the same preference.</text><text x="1290" y="357" fill="#606975" font-size="14" font-weight="400" text-anchor="start">No mixed light/dark policy.</text><text x="1290" y="475" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">Rate is not capacity</text><text x="1290" y="507" fill="#606975" font-size="14" font-weight="400" text-anchor="start">1 Gb/s is link capacity,</text><text x="1290" y="530" fill="#606975" font-size="14" font-weight="400" text-anchor="start">not Internet speed or</text><text x="1290" y="553" fill="#606975" font-size="14" font-weight="400" text-anchor="start">the current transfer rate.</text><text x="1290" y="671" fill="#20242B" font-size="17" font-weight="600" text-anchor="start">Defined coverage</text><text x="1290" y="703" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Both series break at gaps.</text><text x="1290" y="726" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Totals disclose coverage.</text><text x="1290" y="749" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Addresses hidden by default.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">DESIGN CONCEPT · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Concepts and boundaries: spec/08-design-baseline.md</text></g></svg>