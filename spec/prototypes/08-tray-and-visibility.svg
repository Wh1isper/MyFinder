<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Always know why the panel is absent</title><desc>MyFinder high-level design illustration 08. All readings are illustrative sample data, not live measurements.</desc><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#263D37" flood-opacity="0.10"/></filter></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F3F6" stroke="none"/><text x="64" y="52" fill="#2167B5" font-size="15" font-weight="700" text-anchor="start">MYFINDER  /  DESIGN STUDIES</text><text x="1536" y="52" fill="#606975" font-size="17" font-weight="600" text-anchor="end">08</text><text x="64" y="112" fill="#20242B" font-size="42" font-weight="600" text-anchor="start">Always know why the panel is absent</text><text x="64" y="151" fill="#606975" font-size="19" font-weight="400" text-anchor="start">Three states of the same tray menu. Hiding the panel and exiting the application are different actions.</text><text x="64" y="232" fill="#20242B" font-size="25" font-weight="600" text-anchor="start">Shown</text><rect x="64" y="258" width="476" height="485" rx="18" fill="#FFFFFF" stroke="none"/><text x="88" y="303" fill="#20242B" font-size="24" font-weight="600" text-anchor="start">MyFinder</text><rect x="88" y="324" width="130" height="30" rx="15" fill="#EAF0F8" stroke="none"/><text x="153" y="344" fill="#2167B5" font-size="13" font-weight="600" text-anchor="middle">Panel visible</text><text x="88" y="389" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Panel preference: Shown</text><line x1="88" y1="413" x2="516" y2="413" stroke="#DDE1E7" stroke-width="1" /><rect x="76" y="432" width="452" height="53" rx="8" fill="#EDF3ED" stroke="none"/><text x="92" y="466" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Hide panel</text><text x="92" y="535" fill="#20242B" font-size="18" font-weight="400" text-anchor="start">Settings…</text><text x="92" y="593" fill="#20242B" font-size="18" font-weight="400" text-anchor="start">Lock position</text><line x1="88" y1="625" x2="516" y2="625" stroke="#DDE1E7" stroke-width="1" /><text x="92" y="676" fill="#B55D47" font-size="18" font-weight="400" text-anchor="start">Exit MyFinder</text><text x="64" y="797" fill="#606975" font-size="18" font-weight="400" text-anchor="start">A persistent recovery point,</text><text x="64" y="825" fill="#606975" font-size="18" font-weight="400" text-anchor="start">even after the panel is hidden.</text><text x="562" y="232" fill="#20242B" font-size="25" font-weight="600" text-anchor="start">Manually hidden</text><rect x="562" y="258" width="476" height="485" rx="18" fill="#FFFFFF" stroke="none"/><text x="586" y="303" fill="#20242B" font-size="24" font-weight="600" text-anchor="start">MyFinder</text><rect x="586" y="324" width="130" height="30" rx="15" fill="#EAF0F8" stroke="none"/><text x="651" y="344" fill="#606975" font-size="13" font-weight="600" text-anchor="middle">Hidden by you</text><text x="586" y="389" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Panel preference: Hidden</text><line x1="586" y1="413" x2="1014" y2="413" stroke="#DDE1E7" stroke-width="1" /><rect x="574" y="432" width="452" height="53" rx="8" fill="#EDF3ED" stroke="none"/><text x="590" y="466" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Show panel</text><text x="590" y="535" fill="#20242B" font-size="18" font-weight="400" text-anchor="start">Settings…</text><text x="590" y="593" fill="#20242B" font-size="18" font-weight="400" text-anchor="start">Lock position</text><line x1="586" y1="625" x2="1014" y2="625" stroke="#DDE1E7" stroke-width="1" /><text x="590" y="676" fill="#B55D47" font-size="18" font-weight="400" text-anchor="start">Exit MyFinder</text><text x="562" y="797" fill="#606975" font-size="18" font-weight="400" text-anchor="start">Fullscreen starting or ending</text><text x="562" y="825" fill="#606975" font-size="18" font-weight="400" text-anchor="start">does not override this choice.</text><text x="1060" y="232" fill="#20242B" font-size="25" font-weight="600" text-anchor="start">Fullscreen retreat</text><rect x="1060" y="258" width="476" height="485" rx="18" fill="#FFFFFF" stroke="none"/><text x="1084" y="303" fill="#20242B" font-size="24" font-weight="600" text-anchor="start">MyFinder</text><rect x="1084" y="324" width="194" height="30" rx="15" fill="#EAF0F8" stroke="none"/><text x="1181" y="344" fill="#A36A24" font-size="13" font-weight="600" text-anchor="middle">Temporarily retreated</text><text x="1084" y="389" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Panel preference: Shown</text><line x1="1084" y1="413" x2="1512" y2="413" stroke="#DDE1E7" stroke-width="1" /><rect x="1072" y="432" width="452" height="53" rx="8" fill="#EDF3ED" stroke="none"/><text x="1088" y="466" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">Show when fullscreen ends</text><text x="1088" y="535" fill="#20242B" font-size="18" font-weight="400" text-anchor="start">Settings…</text><text x="1088" y="593" fill="#20242B" font-size="18" font-weight="400" text-anchor="start">Lock position</text><line x1="1084" y1="625" x2="1512" y2="625" stroke="#DDE1E7" stroke-width="1" /><text x="1088" y="676" fill="#B55D47" font-size="18" font-weight="400" text-anchor="start">Exit MyFinder</text><text x="1060" y="797" fill="#606975" font-size="18" font-weight="400" text-anchor="start">Show is a request, not a bypass.</text><text x="1060" y="825" fill="#606975" font-size="18" font-weight="400" text-anchor="start">The active policy remains clear.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">DESIGN CONCEPT · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Concepts and boundaries: spec/08-design-baseline.md</text></g></svg>