<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Three selections, three distinct responsibilities</title><desc>MyFinder adopted design baseline 15. All readings are illustrative sample data, not live measurements.</desc><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#263D37" flood-opacity="0.10"/></filter></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F3F6" stroke="none"/><text x="64" y="52" fill="#2167B5" font-size="15" font-weight="700" text-anchor="start">MYFINDER  /  DESIGN STUDIES</text><text x="1536" y="52" fill="#606975" font-size="17" font-weight="600" text-anchor="end">15</text><text x="64" y="112" fill="#20242B" font-size="42" font-weight="600" text-anchor="start">Three selections, three distinct responsibilities</text><text x="64" y="151" fill="#606975" font-size="19" font-weight="400" text-anchor="start">This separation is essential for concurrent multi-drive monitoring without a larger always-visible panel.</text><rect x="64" y="210" width="1020" height="680" rx="14" fill="#FFFFFF" stroke="#DDE1E7"/><text x="90" y="253" fill="#20242B" font-size="26" font-weight="600" text-anchor="start">Storage resources</text><text x="90" y="284" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Monitor many · display one · inspect independently</text><text x="90" y="338" fill="#2167B5" font-size="12" font-weight="700" text-anchor="start">MONITOR</text><text x="230" y="338" fill="#2167B5" font-size="12" font-weight="700" text-anchor="start">RESOURCE / KNOWN MAPPING</text><text x="644" y="338" fill="#2167B5" font-size="12" font-weight="700" text-anchor="start">COMPACT PIN</text><text x="850" y="338" fill="#2167B5" font-size="12" font-weight="700" text-anchor="start">INSPECTION</text><rect x="94" y="388" width="22" height="22" rx="4" fill="#2167B5" stroke="none"/><text x="105" y="404" fill="white" font-size="15" font-weight="600" text-anchor="middle">✓</text><text x="230" y="392" fill="#20242B" font-size="19" font-weight="600" text-anchor="start">System (C:)</text><text x="230" y="419" fill="#606975" font-size="14" font-weight="400" text-anchor="start">NVMe 0 · 621 / 1,000 GB</text><circle cx="660" cy="401" r="10" fill="#2167B5"/><text x="682" y="407" fill="#2167B5" font-size="14" font-weight="400" text-anchor="start">Used capacity</text><text x="850" y="407" fill="#606975" font-size="15" font-weight="400" text-anchor="start">Open details</text><rect x="80" y="458" width="988" height="83" rx="9" fill="#E9F1FC" stroke="none"/><rect x="94" y="484" width="22" height="22" rx="4" fill="#2167B5" stroke="none"/><text x="105" y="500" fill="white" font-size="15" font-weight="600" text-anchor="middle">✓</text><text x="230" y="488" fill="#20242B" font-size="19" font-weight="600" text-anchor="start">Projects (D:)</text><text x="230" y="515" fill="#606975" font-size="14" font-weight="400" text-anchor="start">NVMe 1 · 820 / 2,000 GB</text><circle cx="660" cy="497" r="10" fill="#E2E6EB"/><text x="682" y="503" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Not pinned</text><text x="850" y="503" fill="#2167B5" font-size="15" font-weight="600" text-anchor="start">Viewing now</text><rect x="94" y="580" width="22" height="22" rx="4" fill="#2167B5" stroke="none"/><text x="105" y="596" fill="white" font-size="15" font-weight="600" text-anchor="middle">✓</text><text x="230" y="584" fill="#20242B" font-size="19" font-weight="600" text-anchor="start">Archive (E:)</text><text x="230" y="611" fill="#606975" font-size="14" font-weight="400" text-anchor="start">SATA 2 · 3.2 / 4.0 TB</text><circle cx="660" cy="593" r="10" fill="#E2E6EB"/><text x="682" y="599" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Not pinned</text><text x="850" y="599" fill="#606975" font-size="15" font-weight="400" text-anchor="start">Open details</text><rect x="94" y="676" width="22" height="22" rx="4" fill="#2167B5" stroke="none"/><text x="105" y="692" fill="white" font-size="15" font-weight="600" text-anchor="middle">✓</text><text x="230" y="680" fill="#20242B" font-size="19" font-weight="600" text-anchor="start">Backup (G:)</text><text x="230" y="707" fill="#606975" font-size="14" font-weight="400" text-anchor="start">USB 3 · disconnected</text><circle cx="660" cy="689" r="10" fill="#E2E6EB"/><text x="682" y="695" fill="#606975" font-size="14" font-weight="400" text-anchor="start">Not pinned</text><text x="850" y="695" fill="#606975" font-size="15" font-weight="400" text-anchor="start">Open details</text><text x="90" y="797" fill="#20242B" font-size="16" font-weight="600" text-anchor="start">Collection: C: + D: + E: continue; G: is waiting for the same device.</text><text x="90" y="832" fill="#606975" font-size="15" font-weight="400" text-anchor="start">Removing a checked resource stops new samples, not other resources.</text><text x="90" y="861" fill="#606975" font-size="15" font-weight="400" text-anchor="start">A stopped or missing compact pin is not silently replaced.</text><text x="1130" y="267" fill="#20242B" font-size="21" font-weight="600" text-anchor="start">Compact panel</text><g transform="translate(1130,300) scale(0.75)"><rect x="0" y="0" width="116" height="152" rx="9" fill="#FFFFFF" stroke="#DDE1E7"/><text x="10" y="16" fill="#606975" font-size="11" font-weight="400" text-anchor="start">CPU</text><text x="106" y="32" fill="#20242B" font-size="14" font-weight="600" text-anchor="end">32%</text><text x="10" y="49" fill="#606975" font-size="11" font-weight="400" text-anchor="start">Memory</text><text x="106" y="65" fill="#20242B" font-size="14" font-weight="600" text-anchor="end">15.4 GiB</text><text x="10" y="82" fill="#606975" font-size="11" font-weight="400" text-anchor="start">Ethernet RX</text><text x="106" y="98" fill="#20242B" font-size="14" font-weight="600" text-anchor="end">2.4 MB/s</text><text x="10" y="115" fill="#606975" font-size="11" font-weight="400" text-anchor="start">C: used</text><text x="106" y="131" fill="#20242B" font-size="14" font-weight="600" text-anchor="end">621 GB</text></g><text x="1130" y="475" fill="#2167B5" font-size="18" font-weight="600" text-anchor="start">Still shows C: 621 GB</text><text x="1130" y="520" fill="#606975" font-size="17" font-weight="400" text-anchor="start">D: is inspected, not repinned.</text><text x="1130" y="549" fill="#606975" font-size="17" font-weight="400" text-anchor="start">C: and E: retain history.</text><text x="1130" y="578" fill="#606975" font-size="17" font-weight="400" text-anchor="start">G: is missing, not zero.</text><text x="1130" y="671" fill="#20242B" font-size="21" font-weight="600" text-anchor="start">Explicit actions</text><text x="1130" y="711" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Checkbox: collect / stop.</text><text x="1130" y="740" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Radio: change compact pin.</text><text x="1130" y="769" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Row: inspect resource.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">ADOPTED DESIGN · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Defaults and scope: spec/08-design-baseline.md</text></g></svg>