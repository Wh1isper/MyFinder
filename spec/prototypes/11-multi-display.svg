<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Respect the display, preserve the intent</title><desc>MyFinder adopted design baseline 11. All readings are illustrative sample data, not live measurements.</desc><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#263D37" flood-opacity="0.10"/></filter></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F1F3F6" stroke="none"/><text x="64" y="52" fill="#2167B5" font-size="15" font-weight="700" text-anchor="start">MYFINDER  /  DESIGN STUDIES</text><text x="1536" y="52" fill="#606975" font-size="17" font-weight="600" text-anchor="end">11</text><text x="64" y="112" fill="#20242B" font-size="42" font-weight="600" text-anchor="start">Respect the display, preserve the intent</text><text x="64" y="151" fill="#606975" font-size="19" font-weight="400" text-anchor="start">Illustrative two-display composition. Screen scaling is conceptual here; native mixed-DPI behavior still requires testing.</text><text x="64" y="224" fill="#20242B" font-size="21" font-weight="600" text-anchor="start">DISPLAY A / Fullscreen presentation</text><text x="837" y="224" fill="#20242B" font-size="21" font-weight="600" text-anchor="start">DISPLAY B / Monitoring stays available</text><rect x="64" y="250" width="721" height="431" rx="18" fill="#263C39" stroke="#DDE1E7"/><path d="M64,560.3199999999999 Q316.35,336.2 785,439.64 L785,681 L64,681 Z" fill="#385448"/><rect x="64" y="648" width="721" height="33" rx="0" fill="#1F302B" stroke="none"/><rect x="374.03" y="658" width="16" height="16" rx="3" fill="#2167B5" stroke="none"/><rect x="401.03" y="658" width="16" height="16" rx="3" fill="#B6C4B9" stroke="none"/><rect x="428.03" y="658" width="16" height="16" rx="3" fill="#B6C4B9" stroke="none"/><text x="771" y="669" fill="#E2EBE3" font-size="11" font-weight="400" text-anchor="end">14:30</text><text x="424" y="449" fill="#EAF2EB" font-size="34" font-weight="500" text-anchor="middle">Presentation</text><text x="424" y="489" fill="#BCD0C0" font-size="17" font-weight="400" text-anchor="middle">Fullscreen on A does not hide a panel on B.</text><rect x="837" y="250" width="699" height="431" rx="18" fill="#DEE7E1" stroke="#DDE1E7"/><path d="M837,560.3199999999999 Q1081.65,336.2 1536,439.64 L1536,681 L837,681 Z" fill="#CDDCD2"/><rect x="837" y="648" width="699" height="33" rx="0" fill="#EDF1EB" stroke="none"/><rect x="1137.57" y="658" width="16" height="16" rx="3" fill="#2167B5" stroke="none"/><rect x="1164.57" y="658" width="16" height="16" rx="3" fill="#B6C4B9" stroke="none"/><rect x="1191.57" y="658" width="16" height="16" rx="3" fill="#B6C4B9" stroke="none"/><text x="1522" y="669" fill="#606975" font-size="11" font-weight="400" text-anchor="end">14:30</text><g transform="translate(1369.16,272) scale(0.73)"><rect x="0" y="0" width="208" height="452" rx="20" fill="#FFFFFF" stroke="none"/><text x="104" y="27" fill="#606975" font-size="14" font-weight="600" text-anchor="middle">•••</text><text x="20" y="54" fill="#606975" font-size="10" font-weight="600" text-anchor="start">CPU</text><text x="20" y="84" fill="#20242B" font-size="26" font-weight="600" text-anchor="start">32%</text><path d="M20.0,114.3 L26.0,113.0 L32.0,113.5 L38.0,111.3 L44.0,112.3 L50.0,112.0 L56.0,108.0 L62.0,104.5 L68.0,108.5 L74.0,109.8 L80.0,110.3 L86.0,108.3 L92.0,107.0 L98.0,108.8 L104.0,110.8 L110.0,112.3 L116.0,111.8 L122.0,110.0 L128.0,107.8 L134.0,110.5 L140.0,111.3 L146.0,112.5 L152.0,109.5 L158.0,108.3 L164.0,110.3 L170.0,112.3 L176.0,113.0 L182.0,111.8 L188.0,111.0" fill="none" stroke="#83BAFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="20" y1="136" x2="188" y2="136" stroke="#DDE1E7" stroke-width="1" /><text x="20" y="154" fill="#606975" font-size="10" font-weight="600" text-anchor="start">MEMORY</text><text x="20" y="184" fill="#2