-linejoin="round" stroke-linecap="round"/></g><rect x="1047.16" y="315" width="310" height="222" rx="14" fill="#FFFFFF" stroke="none"/><text x="1065.16" y="345" fill="#20242B" font-size="18" font-weight="600" text-anchor="start">CPU</text><text x="1065.16" y="384" fill="#20242B" font-size="30" font-weight="600" text-anchor="start">32%</text><path d="M1069.2,476.5 L1078.6,472.1 L1088.0,473.9 L1097.4,466.0 L1106.9,469.5 L1116.3,468.6 L1125.7,454.7 L1135.2,442.5 L1144.6,456.5 L1154.0,460.8 L1163.4,462.6 L1172.9,455.6 L1182.3,451.2 L1191.7,457.3 L1201.2,464.3 L1210.6,469.5 L1220.0,467.8 L1229.4,461.7 L1238.9,453.9 L1248.3,463.4 L1257.7,466.0 L1267.2,470.4 L1276.6,459.9 L1286.0,455.6 L1295.4,462.6 L1304.9,469.5 L1314.3,472.1 L1323.7,467.8 L1333.2,465.2" fill="none" stroke="#2167B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="94" cy="761" r="16" fill="#22252A"/><text x="94" y="766" fill="white" font-size="13" font-weight="600" text-anchor="middle">1</text><text x="122" y="766" fill="#20242B" font-size="20" font-weight="600" text-anchor="start">Local visibility</text><text x="122" y="797" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Fullscreen retreat follows the panel’s actual display,</text><text x="122" y="822" fill="#606975" font-size="17" font-weight="400" text-anchor="start">not whichever application was last active elsewhere.</text><circle cx="860" cy="761" r="16" fill="#22252A"/><text x="860" y="766" fill="white" font-size="13" font-weight="600" text-anchor="middle">2</text><text x="888" y="766" fill="#20242B" font-size="20" font-weight="600" text-anchor="start">Reachable inspection</text><text x="888" y="797" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Details open toward available space on this display.</text><text x="888" y="822" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Scale and position are reconciled after moving.</text><text x="64" y="910" fill="#606975" font-size="17" font-weight="400" text-anchor="start">Display removal: choose a reachable fallback without rewriting manual visibility or the preferred placement.</text><line x1="64" y1="944" x2="1536" y2="944" stroke="#DDE1E7" stroke-width="1" /><text x="64" y="974" fill="#606975" font-size="12" font-weight="600" text-anchor="start">ADOPTED DESIGN · ILLUSTRATIVE DATA · NOT A RUNNING APPLICATION</text><text x="1536" y="974" fill="#606975" font-size="12" font-weight="400" text-anchor="end">Defaults and scope: spec/08-design-baseline.md</text></g></svg>