name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install test dependency
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck
      - name: Build application
        run: ./scripts/build.ps1
      - name: Package unsigned artifacts
        run: ./scripts/package.ps1
      - name: Run artifact, desktop, signing, and installation tests
        run: ./scripts/test.ps1 -Install
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain verified unsigned packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/packages/*-portable.zip
            artifacts/packages/*-unsigned.msix
            artifacts/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
